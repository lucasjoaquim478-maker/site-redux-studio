<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="description" content="Discord gamer profile with real-time status, Spotify sync">
  <title>Gamer Profile</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    (function() {
      var isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
      document.documentElement.classList.add(isTouch ? 'touch' : 'no-touch');
    })();
  </script>
</head>
<body>

<div class="bg-gradient"></div>
<canvas id="particles"></canvas>

<div id="enter-screen" class="enter-screen">
  <div class="enter-content">
    <div class="enter-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
      </svg>
    </div>
    <h1 id="enter-title">Clique para entrar</h1>
    <p class="enter-subtitle">Entre na experiência</p>
    <div class="enter-hint">
      <span class="pulse-dot"></span>
      <span id="enter-hint-text">Toque em qualquer lugar</span>
    </div>
  </div>
</div>

<div id="main-content" class="main-content">
  <div class="card">
    <div class="card-header">
      <div class="avatar-box">
        <div class="avatar-glow"></div>
        <img id="avatar" class="avatar" alt="Avatar">
        <div id="status-indicator"></div>
      </div>
      <div class="user-info">
        <h1 id="username">@loading</h1>
        <p class="bio"><span class="badge">Gamer</span><span class="badge">Dev</span></p>
      </div>
    </div>

    <div class="divider"></div>

    <div id="spotify-box" class="section-box"></div>
    <div id="discord-status" class="section-box"></div>

    <div class="stats">
      <div class="stat">
        <span class="stat-label">Horário</span>
        <span id="session-time" class="stat-value">00:00</span>
      </div>
      <div class="stat">
        <span class="stat-label">Visitantes</span>
        <span id="visitor-count" class="stat-value">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Status</span>
        <span id="activity-status" class="stat-value">Loading...</span>
      </div>
    </div>

    <div id="friends-box" class="section-box"></div>

    <button id="copy" class="btn-glow" aria-label="Copy Discord ID">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="9" y="9" width="13" height="13" rx="2"/>
        <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
      </svg>
      Copy Discord
    </button>
  </div>
</div>

<div id="music-control" class="music-control" style="display:none;"></div>

<div id="popup-overlay" class="popup-overlay" style="display:none;">
  <div class="popup-card">
    <div class="popup-icon">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
      </svg>
    </div>
    <h2 class="popup-title">Abrir no Spotify?</h2>
    <p class="popup-subtitle">Clique em confirmar para ouvir a música</p>
    <div class="popup-buttons">
      <button class="popup-btn popup-btn-cancel" onclick="closePopup()">Cancelar</button>
      <button class="popup-btn popup-btn-confirm" onclick="confirmSpotifyAction()">Confirmar</button>
    </div>
  </div>
</div>

<audio id="bg-music" loop preload="auto">
  <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=relaxing-piano-116997.mp3" type="audio/mp3">
</audio>

<script src="script.js"></script>
</body>
</html>

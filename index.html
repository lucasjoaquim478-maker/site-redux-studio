<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gamer Profile</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

<div class="bg-gradient"></div>
<canvas id="particles"></canvas>

<div id="enter-screen" class="enter-screen">
  <div class="enter-content">
    <div class="enter-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
      </svg>
    </div>
    <h1>Clique para entrar</h1>
    <p class="enter-subtitle">Entre na experiência</p>
    <div class="enter-hint">
      <span class="pulse-dot"></span>
      <span>Toque em qualquer lugar</span>
    </div>
  </div>
</div>

<div id="main-content" class="main-content">

<div class="card">

  <div class="card-header">
    <div class="avatar-box">
      <div class="avatar-glow"></div>
      <img id="avatar" class="avatar" alt="Avatar">
      <div id="status-indicator"></div>
    </div>
    <div class="user-info">
      <h1 id="username">@loading</h1>
      <p class="bio"><span class="badge">Gamer</span><span class="badge">Dev</span></p>
    </div>
  </div>

  <div class="divider"></div>

  <div id="spotify-box" class="section-box"></div>

  <div id="discord-status" class="section-box"></div>

  <div class="stats">
    <div class="stat">
      <span class="stat-label">Horário</span>
      <span id="session-time" class="stat-value">00:00</span>
    </div>
    <div class="stat">
      <span class="stat-label">Discord</span>
      <span id="dc-time" class="stat-value">--:--</span>
    </div>
    <div class="stat">
      <span class="stat-label">Status</span>
      <span id="activity-status" class="stat-value">Loading...</span>
    </div>
  </div>

  <button id="copy" class="btn-glow">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="9" y="9" width="13" height="13" rx="2"/>
      <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
    </svg>
    Copy Discord
  </button>

</div>

<div id="cursor"></div>
<div id="cursor-trail"></div>

</div>

<audio id="click-sound">
  <source src="click.mp3">
</audio>

<audio id="bg-music" loop preload="auto">
  <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
</audio>

<div id="music-control" class="music-control">
  <div class="music-handle">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M9 18V5l12-2v13"/>
      <circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
    </svg>
    <span>Música</span>
  </div>
  <div class="music-body">
    <div class="volume-control">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="vol-icon">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M15.54 8.46a5 5 0 010 7.07"/>
      </svg>
      <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" value="15">
    </div>
    <div class="track-control">
      <button id="prev-track" class="track-btn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <div class="track-name" id="track-name">Lofi Study</div>
      <button id="next-track" class="track-btn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DEV LOGS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #00ffcc;
      --primary-dark: #00cc99;
      --bg-dark: #0a0a0f;
      --bg-card: rgba(10, 10, 15, 0.95);
      --border: rgba(0, 255, 204, 0.15);
      --text: #e4e4e7;
      --text-muted: #71717a;
    }
    body { 
      background: var(--bg-dark); 
      color: var(--text); 
      font-family: 'JetBrains Mono', monospace; 
      min-height: 100vh; 
      padding: 12px;
    }
    .logs-container { 
      max-width: 700px; 
      margin: 0 auto; 
    }
    .logs-header { 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      padding: 14px 16px; 
      background: rgba(0, 255, 204, 0.1); 
      border: 1px solid var(--border); 
      border-radius: 12px; 
      margin-bottom: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logs-header h1 { 
      font-size: 0.95rem; 
      color: var(--primary); 
      flex: 1; 
    }
    .status { 
      padding: 4px 10px; 
      border-radius: 20px; 
      font-size: 0.65rem; 
      font-weight: 600; 
    }
    .status.offline { background: #80848e; color: #fff; }
    .status.online { background: #23a55a; color: #fff; }
    .status.error { background: #f23f43; color: #fff; }
    .logs-header button { 
      background: var(--primary); 
      border: none; 
      padding: 8px 14px; 
      border-radius: 8px; 
      cursor: pointer; 
      font-weight: 600;
      font-size: 0.75rem;
    }
    .logs-header button:active { transform: scale(0.95); }
    .logs-body { 
      background: var(--bg-card); 
      border: 1px solid var(--border); 
      border-radius: 12px; 
      padding: 8px; 
      max-height: calc(100vh - 100px); 
      overflow-y: auto; 
    }
    .log-line { 
      padding: 10px 12px; 
      border-bottom: 1px solid rgba(255, 255, 255, 0.04); 
      font-size: 0.72rem; 
      display: flex; 
      flex-direction: column;
      gap: 4px;
    }
    .log-line:last-child { border-bottom: none; }
    .log-top { display: flex; gap: 10px; align-items: center; }
    .log-time { color: var(--primary); font-size: 0.68rem; }
    .log-msg { color: #8b9eff; font-weight: 500; }
    .log-info { color: var(--text-muted); font-size: 0.65rem; }
    .log-line.visit { border-left: 3px solid #23a55a; }
    .log-line.login { border-left: 3px solid #8b5cf6; }
    .log-line.empty, .log-line.loading { color: var(--text-muted); text-align: center; padding: 20px; }
    
    .stats-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .stat-item {
      flex: 1;
      background: rgba(0, 255, 204, 0.08);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .stat-num { font-size: 1.2rem; color: var(--primary); font-weight: 700; }
    .stat-label { font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; }

    @media (min-width: 500px) {
      body { padding: 20px; }
      .logs-header { padding: 16px 20px; }
      .logs-header h1 { font-size: 1.1rem; }
      .log-line { 
        flex-direction: row;
        gap: 12px;
        padding: 12px 16px;
      }
      .log-msg { flex: 1; }
      .log-time { font-size: 0.72rem; width: 140px; }
      .log-info { width: 200px; text-align: right; }
      .stats-bar { gap: 12px; }
      .stat-item { padding: 14px; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="logs-container">
    <div class="logs-header">
      <h1>DEV LOGS</h1>
      <span id="status" class="status offline">Offline</span>
      <button onclick="fetchLogs()">↻</button>
    </div>
    <div class="stats-bar">
      <div class="stat-item">
        <div class="stat-num" id="total-visits">0</div>
        <div class="stat-label">Total Visits</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="today-visits">0</div>
        <div class="stat-label">Today</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="online-now">0</div>
        <div class="stat-label">Online</div>
      </div>
    </div>
    <div id="logs-body" class="logs-body">
      <div class="log-line loading">Carregando logs...</div>
    </div>
  </div>
  <script>
    const BIN_ID = "69f5565eaaba8821975fc35a";
    
    async function fetchLogs() {
      try {
        document.getElementById("status").className = "status offline";
        document.getElementById("status").textContent = "Carregando...";
        
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest?fetch=true`);
        
        if (!res.ok) throw new Error("API error");
        
        const data = await res.json();
        const logs = data.record?.logs || [];
        
        const hoje = new Date().toDateString();
        const visitsToday = logs.filter(l => new Date(l.time).toDateString() === hoje).length;
        
        document.getElementById("total-visits").textContent = logs.length;
        document.getElementById("today-visits").textContent = visitsToday;
        document.getElementById("online-now").textContent = logs.filter(l => l.type === "login").length;
        
        if (logs.length === 0) {
          document.getElementById("logs-body").innerHTML = '<div class="log-line empty">Nenhuma visita ainda</div>';
          return;
        }
        
        document.getElementById("logs-body").innerHTML = logs.slice(0, 100).map(log => {
          const time = new Date(log.time);
          const timeStr = time.toLocaleString("pt-BR");
          const msg = log.message || "Visita";
          const typeClass = log.type || "visit";
          return `<div class="log-line ${typeClass}">
            <span class="log-time">[${timeStr}]</span>
            <span class="log-msg">${msg}</span>
          </div>`;
        }).join("");
        
        document.getElementById("status").className = "status online";
        document.getElementById("status").textContent = "Online";
      } catch (err) {
        document.getElementById("status").className = "status error";
        document.getElementById("status").textContent = "Erro";
        document.getElementById("logs-body").innerHTML = `<div class="log-line error">Erro: ${err.message}</div>`;
      }
    }
    
    fetchLogs();
    setInterval(fetchLogs, 3000);
  </script>
</body>
</html>
